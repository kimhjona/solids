name: Daily solids email

on:
  schedule:
    # 13:00 UTC is 6am Pacific in summer, 5am in winter. Change this if you
    # would rather have it land at a different time.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render the email without sending it"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Send the daily plan
        env:
          SOLIDS_CONFIG: solids.config.json
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Only needed if mail_transport is "resend" or "smtp".
          # The default "outbox" transport needs no sending credential.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            solids daily --dry-run
          else
            solids daily
          fi

      - name: Keep the rendered email when it was a dry run
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: email
          path: solids-email*.html
